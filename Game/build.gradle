plugins {
    id 'java'
    id 'application'
}

group = 'com.fishafish'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

ext { gdxVersion = '1.12.1' }

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'com.fishafish.DesktopLauncher'
}

sourceSets {
    main {
        resources.srcDirs = ['assets']
    }
}

tasks.register('fatJar', Jar) {
    archiveBaseName.set('fish-a-fish')
    archiveClassifier.set('all')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.fishafish.DesktopLauncher'
    }
    from sourceSets.main.output
    from('assets') { into 'assets' }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

// A pasta "assets" é o diretório de trabalho (Gdx.files.internal lê de lá)
run {
    workingDir = file('assets')
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}