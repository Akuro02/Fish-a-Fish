plugins {
    id 'java'
    id 'application'
}

group = 'com.fishafish'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

ext { gdxVersion = '1.12.1' }

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'com.fishafish.DesktopLauncher'
}

// A pasta "assets" é o diretório de trabalho (Gdx.files.internal le de la)
run {
    workingDir = file('assets')
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}

sourceSets {
    main {
        resources {
            // Includes the assets folder so assets/player.png is preserved inside the JAR
            srcDirs += ["."]
            include "assets/**"
        }
    }
}
